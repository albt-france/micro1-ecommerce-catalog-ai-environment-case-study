# Navigation taxonomy of the demo shop (source of truth). Built by src/build_taxonomy.py into
# taxonomy/categories.csv (ids, paths, Google Product Taxonomy ids) and taxonomy/source_mapping.csv.
#
# department > group [/ subgroup] > leaf      (3 or 4 levels)
# Per leaf:
#   gpt    Google Product Taxonomy path (2021-09-21, en-US); resolved to its numeric id at build time
#   attrs  attribute template (taxonomy/category_attributes.yaml)
#   abo    ABO product_type values that map directly to this leaf
#   off_cat Open Food Facts query categories that map directly to this leaf
#   kw     regular expression on the source browse path + title, used for generic source types
#          (SHOES, HOME, GROCERY, ACCESSORY...) and by the keyword stage of the classifier. First match wins.
departments:
- name: "Home & Furniture"
  groups:
  - name: "Living Room Furniture"
    leaves:
    - {name: "Sofas & Couches", gpt: "Furniture > Sofas", attrs: furniture, abo: [SOFA], kw: "sofas? |couch|sofa-?bed|loveseat|sectional"}
    - {name: "Armchairs & Accent Chairs", gpt: "Furniture > Chairs > Arm Chairs, Recliners & Sleeper Chairs", attrs: furniture, abo: [BEAN_BAG_CHAIR], kw: "living room furniture/chairs|accent chair|armchair|club chair|recliner|bean ?bag"}
    - {name: "Ottomans & Poufs", gpt: "Furniture > Ottomans", attrs: furniture, abo: [OTTOMAN], kw: "ottoman|pouf"}
    - {name: "Coffee Tables, Side Tables & TV Stands", gpt: "Furniture > Tables > Accent Tables", attrs: furniture, kw: "coffee table|side table|end table|accent table|console table|nightstand|tv stand|media (storage|console)|entertainment center|television stand"}
  - name: "Bedroom Furniture"
    leaves:
    - {name: "Beds, Frames & Headboards", gpt: "Furniture > Beds & Accessories > Beds & Bed Frames", attrs: furniture, abo: [BED, BED_FRAME, HEADBOARD], kw: "bed frame|platform bed|daybed|headboard"}
    - {name: "Dressers & Chests", gpt: "Furniture > Cabinets & Storage > Dressers", attrs: furniture, abo: [DRESSER], kw: "dresser|chest of drawers"}
  - name: "Dining Furniture"
    leaves:
    - {name: "Dining Chairs", gpt: "Furniture > Chairs > Kitchen & Dining Room Chairs", attrs: furniture, kw: "dining (room )?(furniture/)?chairs?|kitchen & dining room furniture/chairs"}
    - {name: "Dining Tables", gpt: "Furniture > Tables > Kitchen & Dining Room Tables", attrs: furniture, kw: "dining table|kitchen table"}
    - {name: "Stools & Benches", gpt: "Furniture > Chairs > Table & Bar Stools", attrs: furniture, abo: [STOOL_SEATING, BENCH], kw: "bar stool|counter stool|barstool|\\bbench"}
  - name: "Home Office Furniture"
    leaves:
    - {name: "Office Chairs", gpt: "Furniture > Office Furniture > Office Chairs", attrs: furniture, kw: "office chair|desk chair|task chair|gaming chair|home office chairs"}
